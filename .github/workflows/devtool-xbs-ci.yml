name: Devtool XBS Go and Android candidates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      android_debug:
        description: Build the Android Companion debug APK
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  go-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: R07A immutable action and mandatory gate audit
        env:
          XBS_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/ci/r07a_policy.py --repo . --hosted
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23'
          cache: false
      - name: Go unit tests
        run: go test ./...
      - name: Go race detector
        run: go test -race ./internal/config ./internal/control ./internal/daemon
      - name: Go vet
        run: go vet ./...
      - name: R09A bounded backend fuzz, repeat and coverage
        env:
          XBS_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/ci/r09a_backend_lane.py --hosted --repo .
      - name: R09B deterministic fault injection and zip negatives
        env:
          XBS_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/ci/r09b_backend_matrix.py --hosted --repo .
      - name: R09C fake Android backend and CLI golden contracts
        env:
          XBS_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/ci/r09c_backend_model.py --hosted --repo .
      - name: R09D crash recovery and complete risk coverage inventory
        env:
          XBS_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/ci/r09d_risk_coverage.py --hosted --repo .
      - name: R09E seven-package boundaries and measured coverage non-regression
        env:
          XBS_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/ci/r09e_boundary_coverage.py --hosted --repo .
      - name: R09F adversarial recovery and final hosted evidence ledger
        env:
          XBS_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/ci/r09f_final_ledger.py --hosted --repo .
      - name: R06B HF03 actual Go test case counts
        env:
          XBS_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/ci/r06b_devtool_qualification.py count-go --repo .
      - name: R06B source-pinned Devtool runtime qualification
        env:
          XBS_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/ci/r06b_devtool_qualification.py hosted --repo .
      - name: GX01 independent ledger audit and adversarial regressions
        run: |
          python3 -B scripts/ci/gx01_ci_verify.py .
          python3 -B scripts/ci/test_gx01_reconciliation.py
      - name: GX02 source-bound Devtool and CI reliability acceptance
        env:
          XBS_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B scripts/ci/gx02_ci_verify.py .
          python3 -B scripts/ci/test_gx02_control.py
      - name: XBS contracts
        run: go run ./cmd/xbs contracts check
      - name: Source-bound final seal
        run: go run ./cmd/xbsrepo final-seal
      - name: Android module candidate
        run: go run ./cmd/xbsrepo build-module --out dist/XtremeBS-go.zip
      - name: Module checksum
        run: sha256sum dist/XtremeBS-go.zip | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xbs-android-module-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/XtremeBS-go.zip
            dist/SHA256SUMS
            dist/r06b-devtool-qualification.json
            dist/r06b-go-test-counts.json
            dist/r09a-backend-qualification.json
            dist/r09a-backend.coverprofile
            dist/r09b-backend-matrix.json
            dist/r09c-backend-model.json
            dist/r09c-backend.coverprofile
            dist/r09d-risk-coverage.json
            dist/r09d-risk.coverprofile
            dist/r09e-boundary-coverage.json
            dist/r09f-final-ledger.json
          if-no-files-found: error
          retention-days: 14
  android-companion-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Guard Android SDK setup against obsolete tools package
        run: python3 scripts/ci/test_r05a_hf01_sdk_setup.py
      - name: R05C HF03/HF01 named-step SDK inventory and mutation regressions
        run: python3 scripts/ci/test_r05c_hf03_sdk_inventory.py
      - name: R05C HF04 complete repository Python CI suite
        run: |
          python3 scripts/ci/r05c_full_ci_precommit.py --self-test
          python3 scripts/ci/r05c_full_ci_precommit.py --run
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools'
      - name: Install Android API 36 for hosted JVM tests
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.7.1'
      - name: Android JVM unit suite
        working-directory: android-app
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest
      - name: R06B HF03 actual Android JVM case counts
        env:
          XBS_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/ci/r06b_devtool_qualification.py count-jvm --repo .
      - name: Publish SHA-bound Android JVM counts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xbs-android-jvm-counts-${{ github.run_id }}-${{ github.run_attempt }}
          path: android-evidence/r06b-jvm-test-counts.json
          if-no-files-found: error
          retention-days: 14
  android-companion-api36:
    # Required PR gate; never mark root/physical acceptance from this rootless emulator.
    needs: [go-contract, android-companion-jvm]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.7.1'
      - name: R05C source and workflow contracts
        run: python3 scripts/ci/test_r05c_source_contract.py
      - name: Enable KVM for API36 emulator
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Initialize Android SDK command-line tools for API36
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools'
      - name: Install Android API36 build-tools 36.0.0
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager 'build-tools;36.0.0'
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Android API36 rootless instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            gradle -p android-app --no-daemon --console=plain -PxbsR05cEmulator=true '-Pandroid.testInstrumentationRunnerArguments.class=io.github.mikeceead.xbscompanion.R05cBridgeReplayInstrumentedTest,io.github.mikeceead.xbscompanion.R05cTaskerBoundaryInstrumentedTest,io.github.mikeceead.xbscompanion.R05cLifecycleInstrumentedTest,io.github.mikeceead.xbscompanion.R05cUiSmokeInstrumentedTest,io.github.mikeceead.xbscompanion.PostAuditPendingCommandInstrumentedTest,io.github.mikeceead.xbscompanion.PostAuditRoomMainThreadInstrumentedTest' :app:connectedDebugAndroidTest
            python3 scripts/ci/r05c_verify_instrumentation.py --results android-app/app/build/outputs/androidTest-results/connected
            gradle -p android-app --no-daemon --console=plain :app:assembleDebug
            APK=android-app/app/build/outputs/apk/debug/app-debug.apk; HEAD_SHA=$(git rev-parse HEAD); test "$HEAD_SHA" = '${{ github.event.pull_request.head.sha || github.sha }}' && test -s "$APK" && "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK" && mkdir -p android-evidence && cp "$APK" android-evidence/xbs-companion-r05c-api36-debug.apk && (cd android-evidence && sha256sum xbs-companion-r05c-api36-debug.apk > SHA256SUMS) && printf '%s\n' "$HEAD_SHA" > android-evidence/SOURCE_SHA
      - name: Publish SHA-bound debug candidate, no logs or private device state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xbs-companion-r05c-api36-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android-evidence/xbs-companion-r05c-api36-debug.apk
            android-evidence/SHA256SUMS
            android-evidence/SOURCE_SHA
          if-no-files-found: error
          retention-days: 14
  android-companion-debug:
    if: github.event_name == 'workflow_dispatch' && inputs.android_debug == true
    needs: go-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Guard Android SDK setup against obsolete tools package
        run: python3 scripts/ci/test_r05a_hf01_sdk_setup.py
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools'
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.7.1'
      - name: Build Android debug APK
        working-directory: android-app
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Validate APK and evidence
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          mkdir -p android-evidence
          cp "$APK" android-evidence/xbs-companion-debug.apk
          (cd android-evidence && sha256sum xbs-companion-debug.apk > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xbs-companion-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: android-evidence/
          if-no-files-found: error
          retention-days: 14
