name: Devtool S7 P05 XBS Android Consumer Adoption

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-adoption-contract:
    name: Canonical Devtool Android audit and exact-tree scaffold (non-release)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact Android consumer PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Create local inspection branch (never pushed)
        run: git switch -c s7-p05-android-ci-inspection
      - name: Install reviewed Devtool S7 P02 (outside consumer tree)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/devtool-s7-p05-env"
          "$RUNNER_TEMP/devtool-s7-p05-env/bin/python" -m pip install --disable-pip-version-check \
            'git+https://github.com/Mikeyphw/devtool.git@416d24140c7f7a4b9833d7cb19df50ca7e7363b8'
          echo "$RUNNER_TEMP/devtool-s7-p05-env/bin" >> "$GITHUB_PATH"
      - name: Canonical Devtool read-only adoption, exact-tree and drift tests
        run: python3 -B -m unittest discover -s tests -p 'test_devtool_s7_p05_android_adoption.py' -v

  android-hosted-debug:
    name: XBS Android API36 debug APK and unit tests (non-release)
    needs: android-adoption-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Checkout exact Android consumer PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure hosted Android SDK
        uses: android-actions/setup-android@v3
      - name: Provision API 36 and Build Tools 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Configure stable Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Existing native Android debug and unit-test tasks
        working-directory: android-app
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest
      - name: Verify APK and record source-bound digest
        shell: bash
        run: |
          set -euo pipefail
          apk='android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify "$apk"
          mkdir -p "$RUNNER_TEMP/s7-p05-evidence"
          cp "$apk" "$RUNNER_TEMP/s7-p05-evidence/xbs-debug.apk"
          (cd "$RUNNER_TEMP/s7-p05-evidence" && sha256sum xbs-debug.apk > SHA256SUMS)
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$RUNNER_TEMP/s7-p05-evidence/SOURCE_SHA"
          test "$(cat "$RUNNER_TEMP/s7-p05-evidence/SOURCE_SHA")" = "$(git rev-parse HEAD)"
      - name: Retain non-release debug evidence
        uses: actions/upload-artifact@v4
        with:
          name: xbs-s7-p05-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s7-p05-evidence/
          if-no-files-found: error
          retention-days: 14
