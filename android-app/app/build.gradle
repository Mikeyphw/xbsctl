            'src/main/java/io/github/mikeceead/xbscompanion/XbsCompatibilityReport.java',
            'src/main/java/io/github/mikeceead/xbscompanion/XbsCompatibilityStore.java',
            'src/main/java/io/github/mikeceead/xbscompanion/XbsCompatibilityProbe.java',
            'src/main/java/io/github/mikeceead/xbscompanion/XbsCapabilityRegistry.java'
        ].each { relative ->
            if (!file(relative).isFile()) throw new GradleException("Missing release-readiness source: ${relative}")
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ['assembleRelease', 'bundleRelease']) {
        task.dependsOn tasks.named('verifyReleaseReadiness')
    }
}


baselineProfile {
    // AGP 9.3 / Baseline Profile 1.5 rejects false/false during configuration.
    // Keep generated profiles out of src while allowing release builds to generate build-dir evidence.
    automaticGenerationDuringBuild true
    saveInSrc false
}


tasks.named('preBuild').configure { dependsOn rootProject.tasks.named('verifyStableToolchainBaseline') }
