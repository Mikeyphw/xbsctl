            'src/main/java/io/github/mikeceead/xbscompanion/SecuritySealPolicy.java',
            'src/main/java/io/github/mikeceead/xbscompanion/SecuritySealStore.java',
            'src/main/java/io/github/mikeceead/xbscompanion/SecuritySealEvaluator.java',
            'src/main/java/io/github/mikeceead/xbscompanion/SecuritySealActivity.java',
            'src/main/java/io/github/mikeceead/xbscompanion/AdaptiveLayoutPolicy.java',
            'src/main/java/io/github/mikeceead/xbscompanion/AccessibilityUiPolicy.java',
            'src/main/java/io/github/mikeceead/xbscompanion/UiQualityReport.java',
            'src/main/java/io/github/mikeceead/xbscompanion/UiQualityStore.java',
            'src/main/java/io/github/mikeceead/xbscompanion/PerformanceReport.java',
            'src/main/java/io/github/mikeceead/xbscompanion/PerformanceStore.java',
