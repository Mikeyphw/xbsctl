            'src/main/java/io/github/mikeceead/xbscompanion/ReleaseReadinessPolicy.java',
            'src/main/java/io/github/mikeceead/xbscompanion/ReleaseReadinessReport.java',
            'src/main/java/io/github/mikeceead/xbscompanion/DebugHealthReport.java',
            'src/main/java/io/github/mikeceead/xbscompanion/DebugHealthPolicy.java',
